apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: yelp-lab2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: your-dockerhub-user/yelp-user-service:latest
          env:
            - name: MONGODB_URI
              value: mongodb://mongo:27017
            - name: MONGODB_DB_NAME
              value: yelp_lab2
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_INLINE_CONSUMER
              value: "true"
            - name: SECRET_KEY
              value: replace-me
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: yelp-lab2
spec:
  selector:
    app: user-service
  ports:
    - port: 8000
      targetPort: 8000
---
