apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: yelp-lab2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: DOCKERHUB_USER/yelp-api-gateway:latest
          env:
            - name: MONGODB_URI
              value: mongodb://mongo:27017
            - name: MONGODB_DB_NAME
              value: yelp_lab2
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_INLINE_CONSUMER
              value: "true"
            - name: SECRET_KEY
              value: lab2-secret-change-me
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: yelp-lab2
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8000
